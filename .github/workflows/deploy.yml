name: Publish to deploy branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   # match <TargetFramework> in CookBookRazor.csproj

      - name: Publish
        run: dotnet publish CookBookRazor/CookBookRazor.csproj -c Release -r win-x86 --self-contained true -o ./publish

      - name: Push to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./publish
          force_orphan: true
